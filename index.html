                    ctx.fill();
                    ctx.restore();
                }

                // Render Players
                const drawP = (p, isMe) => {
                    if (!isMe && Date.now() - p.lastUpdate > 10000) return;
                    if (p.eliminated && !isMe) return;
                    ctx.font = `${TILE_SIZE * 0.7}px Arial`;

                    const bounce = Math.sin(Date.now() * 0.01 + p.x + p.y) * 4;
                    const emoji = p.eliminated ? '💀' : (isMe ? '🤠' : '👨‍🌾');
                    ctx.fillText(emoji, p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE * 0.8 + bounce);

                    ctx.font = '12px Inter'; ctx.fillStyle = isMe ? '#34d399' : 'white';
                    ctx.fillText(p.name, p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE - 5 + bounce);

                    if (metadata.currentGame === 'reapers' && !isMe) {
                        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 10px Inter';
                        ctx.fillText(p.score, p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE - 20 + bounce);
                    }
                };
                for (let id in players) drawP(players[id], false);
                drawP(player, true);

                // Render Crocodiles for Speed Swimmer (Crossy Road style per-lane)
                if (metadata.currentGame === 'swimmer') {
                    ctx.font = `${TILE_SIZE * 0.7}px Arial`;
                    for (let y = 0; y < GRID_SIZE; y++) {
                        // Only danger lanes (non-safe)
                        if (y < 3 || y >= GRID_SIZE - 3 || y % 4 === 0) continue;
                        const laneIdx = y;
                        const dir = (laneIdx % 2 === 0) ? 1 : -1;
                        const speed = dir * (0.02 + (laneIdx % 5) * 0.008);
                        // 2-3 crocs per lane
                        const crocCount = 2 + (laneIdx % 2);
                        const spacing = GRID_SIZE * TILE_SIZE / crocCount;
                        for (let c = 0; c < crocCount; c++) {
                            let cx = (Date.now() * speed + c * spacing + laneIdx * 200) % (GRID_SIZE * TILE_SIZE + TILE_SIZE * 2);
                            if (cx < -TILE_SIZE) cx += GRID_SIZE * TILE_SIZE + TILE_SIZE * 2;
                            if (cx > GRID_SIZE * TILE_SIZE + TILE_SIZE) cx -= GRID_SIZE * TILE_SIZE + TILE_SIZE * 2;

                            ctx.save();
                            ctx.translate(cx, y * TILE_SIZE + TILE_SIZE * 0.7);
                            if (speed < 0) ctx.scale(-1, 1);
                            ctx.fillText('🐊', 0, 0);
                            ctx.restore();

                            // Collision
                            if (player.active && !player.eliminated &&
                                Math.abs(player.x * TILE_SIZE - cx) < TILE_SIZE * 0.6 &&
                                Math.abs(player.y - y) < 1) {
                                player.x = Math.floor(GRID_SIZE / 2);
                                player.y = 1;
                                showToast('🐊 Chomped! Back to start!');
                            }
                        }
                    }
                }

                ctx.restore();
            } catch (e) {
                console.error("Game loop error:", e);
                showToast("Render error: " + e.message);
            }
            requestAnimationFrame(gameLoop);

            function resize() {
                if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                }
            }

            // --- UI Interactions ---
            window.setTool = (t) => {
                player.tool = t;
                document.querySelectorAll('#toolbar button').forEach(b => {
                    b.classList.remove('bg-emerald-600', 'border-white');
                    b.classList.add('bg-white/5', 'border-transparent');
                });
                document.getElementById(`tool-${t}`).classList.add('bg-emerald-600', 'border-white');
            };

            window.copyRoomCode = () => {
                const dummy = document.createElement("input");
                document.body.appendChild(dummy);
                dummy.value = roomCode; dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                showToast(`Room Code ${roomCode} copied!`);
            };

            // --- Start App ---
            init();
        </script>
